[project]
name = "Domain FAQ Support Chatbot Docs"
site_name = "Domain FAQ Support Chatbot Using Fine Tuned SLMs"
site_description = "Visual technical documentation for Domain FAQ Support Chatbot Using Fine Tuned Small Language Models"
site_url = "https://rbijo.github.io/dfcs.docs/"
repo_url = "https://github.com/rbijo/dfcs.docs"
repo_name = "rbijo/dfcs.docs"
docs_dir = "docs"
site_dir = "site"

nav = [
    { "Home" = "index.md" },
    { "Development" = [
        "development/index.md",
        { "Dataset Build" = [
            "development/dataset-build/index.md",
            { "Data Collection" = "development/dataset-build/data-collection.md" },
            { "Data Cleaning" = "development/dataset-build/data-cleaning.md" },
            { "Dataset Formatting" = "development/dataset-build/dataset-formatting.md" },
            { "Dataset Validation" = "development/dataset-build/dataset-validation.md" }
        ]},
        { "Fine Tuning the Model" = [
            "development/fine-tuning/index.md",
            { "Model Selection" = "development/fine-tuning/model-selection.md" },
            { "Training" = "development/fine-tuning/training.md" },
            { "Evaluation" = "development/fine-tuning/evaluation.md" },
            { "Results" = "development/fine-tuning/results.md" }
        ]},
        { "Developing the Website" = [
            "development/website/index.md",
            { "Architecture" = "development/website/architecture.md" },
            { "Frontend" = "development/website/frontend.md" },
            { "Backend" = "development/website/backend.md" },
            { "Deployment" = "development/website/deployment.md" }
        ]},
        { "References" = "development/references.md" }
    ]},
    { "For the Devs" = [
        "for-the-devs/index.md",
        { "Changelog" = "for-the-devs/changelog.md" },
        { "Getting Started" = "for-the-devs/getting-started.md" },
        { "Installing Zensical" = "for-the-devs/installing-zensical.md" },
        { "Project Structure" = "for-the-devs/project-structure.md" },
        { "Writing Documentation" = "for-the-devs/writing-documentation.md" },
        { "Zensical Features" = "for-the-devs/zensical-features.md" },
        { "Navigation" = "for-the-devs/navigation.md" },
        { "Images and Assets" = "for-the-devs/images-assets.md" },
        { "Diagrams" = "for-the-devs/diagrams.md" },
        { "Badges" = "for-the-devs/badges.md" },
        { "References" = "for-the-devs/references.md" },
        { "Zensical Studio" = "for-the-devs/zensical-studio.md" },
        { "Local Development" = "for-the-devs/local-development.md" },
        { "Git Workflow" = "for-the-devs/git-workflow.md" },
        { "Testing and Validation" = "for-the-devs/testing-validation.md" },
        { "Building the Site" = "for-the-devs/building.md" },
        { "Publishing to GitHub Pages" = "for-the-devs/publishing.md" },
        { "Troubleshooting" = "for-the-devs/troubleshooting.md" }
    ]}
]

[theme]
name = "zensical"
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "toc.integrate",
    "search.suggest",
    "search.highlight",
    "content.code.copy"
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }
