[project]
name = "Domain FAQ Support Chatbot Docs"
site_name = "Domain FAQ Support Chatbot Using Fine Tuned SLMs"
site_description = "Visual technical documentation for Domain FAQ Support Chatbot Using Fine Tuned Small Language Models"
site_url = "https://rbijo.github.io/dfcs.docs/"
repo_url = "https://github.com/rbijo/dfcs.docs"
repo_name = "rbijo/dfcs.docs"
docs_dir = "docs"
site_dir = "site"

[theme]
name = "zensical"
language = "en"
palette = { primary = "indigo", accent = "blue" }
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "toc.integrate",
    "search.suggest",
    "search.highlight",
    "content.code.copy"
]

[[project.nav]]
name = "Home"
url = "index.md"
icon = "fontawesome/solid/house"

[[project.nav]]
name = "Development"
url = "development/index.md"
icon = "fontawesome/solid/code"
children = [
